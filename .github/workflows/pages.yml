name: Publish web build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-web.txt

      - name: Check browser audio files
        shell: bash
        run: |
          missing=0
          while IFS= read -r -d '' file; do
            ogg="${file%.*}.ogg"
            if [ ! -f "$ogg" ]; then
              echo "::error file=$file::Missing browser audio file: $ogg"
              missing=1
            fi
          done < <(find audio -type f \( -name '*.wav' -o -name '*.mp3' \) -print0)
          exit "$missing"

      - name: Build Pygbag package
        run: python -m pygbag --build .

      - name: Polish web shell
        run: python tools/patch_web_build.py

      - name: Prepare GitHub Pages artifact
        run: touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
